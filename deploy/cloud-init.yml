#cloud-config
# First-boot setup for the Slotnest droplet: Docker, firewall, swap, automatic security updates, nightly backup.
package_update: true
packages:
  - ca-certificates
  - curl
  - ufw
  - unattended-upgrades
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - ufw default deny incoming
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443
  - ufw --force enable
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - mkdir -p /opt/slotnest/backups
  - echo '30 3 * * * root /bin/sh /opt/slotnest/backup.sh >> /var/log/slotnest-backup.log 2>&1' > /etc/cron.d/slotnest-backup
